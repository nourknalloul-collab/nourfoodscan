function normalizeFoodAnalysis(raw) {
  const items = (raw.items || []).map((it, i) => ({
    id: it.id || `item_${Date.now()}_${i}`,
    name: it.name || "طعام غير معروف",
    grams: Number(it.estimated_weight_g ?? it.grams ?? 0) || 0,
    calories: Number(it.calories) || 0,
    protein_g: Number(it.protein_g) || 0,
    carbs_g: Number(it.carbs_g) || 0,
    fat_g: Number(it.fat_g) || 0,
    confidence: Math.max(0, Math.min(1, Number(it.confidence ?? 0.6))),
    notes: it.notes || ""
  }));
  const total = raw.total || {};
  const computed = items.reduce((a, it) => ({
    calories: a.calories + it.calories, protein_g: a.protein_g + it.protein_g,
    carbs_g: a.carbs_g + it.carbs_g, fat_g: a.fat_g + it.fat_g,
  }), { calories:0, protein_g:0, carbs_g:0, fat_g:0 });
  return {
    meal_name: raw.meal_name || "وجبة",
    items,
    total: {
      calories: Number(total.calories) || Math.round(computed.calories),
      protein_g: Number(total.protein_g) || Math.round(computed.protein_g),
      carbs_g: Number(total.carbs_g) || Math.round(computed.carbs_g),
      fat_g: Number(total.fat_g) || Math.round(computed.fat_g),
    },
    uncertainty_notes: raw.uncertainty_notes || []
  };
}

function safeParseAIResponse(text) {
  try { return JSON.parse(text); } catch (e) {}
  const match = text.match(/\{[\s\S]*\}/);
  if (match) { try { return JSON.parse(match[0]); } catch (e) {} }
  throw new Error("invalid_json");
}

function compressImage(file, maxDim = 900, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = height * (maxDim/width); width = maxDim; }
        else if (height > maxDim) { width = width * (maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function calcFromFood(food, grams) {
  const r = grams / 100;
  return {
    id: `manual_${Date.now()}`, name: food.ar, grams: Math.round(grams),
    calories: Math.round(food.per100.cal * r), protein_g: Math.round(food.per100.p * r * 10)/10,
    carbs_g: Math.round(food.per100.c * r * 10)/10, fat_g: Math.round(food.per100.f * r * 10)/10,
    confidence: 1, notes: ""
  };
}

/* =========================================================================
   3) NUTRITION CALCULATOR
========================================================================= */
const ACTIVITY_FACTORS = { sedentary:1.2, light:1.375, moderate:1.55, active:1.725, very_active:1.9 };
function calcBMR({ gender, weight, height, age }) {
  const base = 10*weight + 6.25*height - 5*age;
  return gender === 'male' ? base + 5 : base - 161;
}
function calcTDEE(bmr, activity) { return bmr * (ACTIVITY_FACTORS[activity] || 1.2); }
function calcGoals({ tdee, goal }) {
  let calories = tdee;
  if (goal === 'lose') calories = tdee - 450;
  if (goal === 'gain') calories = tdee + 350;
  calories = Math.max(1200, Math.round(calories));
  const protein_g = Math.round((calories * 0.28) / 4);
  const fat_g = Math.round((calories * 0.27) / 9);
  const carbs_g = Math.round((calories - protein_g*4 - fat_g*9) / 4);
  return { calories, protein_g, carbs_g, fat_g };
}

function todayKey(d = new Date()) { return d.toISOString().slice(0,10); }

const DB = {
  async getProfile(userId) {
    const { data, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
    if (error) throw error;
    return data;
  },
  async upsertProfile(userId, fields) {
    const { data, error } = await supabase.from('profiles').update(fields).eq('id', userId).select().single();
    if (error) throw error;
    return data;
  },
  async getSubscription(userId) {
    const { data, error } = await supabase.from('subscriptions').select('*').eq('user_id', userId)
      .order('started_at', { ascending:false }).limit(1).maybeSingle();
    if (error) throw error;
    return data;
  },
  async getMeals(userId) {
    const { data, error } = await supabase.from('meals').select('*').eq('user_id', userId).order('logged_at', { ascending:true });
    if (error) throw error;
    return data.map(m => ({
      id:m.id, meal_name:m.meal_name, slot:m.slot, items:m.items, total:m.total,
      image:m.image_url, uncertainty_notes:m.uncertainty_notes, time: new Date(m.logged_at).getTime()
    }));
  },
  async addMeal(userId, meal) {
    const { data, error } = await supabase.from('meals').insert({
      user_id:userId, meal_name:meal.meal_name, slot:meal.slot, items:meal.items, total:meal.total,
      image_url:meal.image, uncertainty_notes:meal.uncertainty_notes||[]
    }).select().single();
    if (error) throw error;
    return data;
  },
  async deleteMeal(id) {
    const { error } = await supabase.from('meals').delete().eq('id', id);
    if (error) throw error;
  },
  async getWeightLogs(userId) {
    const { data, error } = await supabase.from('weight_logs').select('*').eq('user_id', userId).order('logged_at', { ascending:true });
    if (error) throw error;
    return data.map(w => ({ id:w.id, weight:w.weight, date:new Date(w.logged_at).getTime() }));
  },
  async addWeightLog(userId, weight) {

    if (error) throw error;
    return data;
  },
  async getWaterToday(userId) {
    const { data, error } = await supabase.from('water_logs').select('*').eq('user_id', userId).eq('log_date', todayKey()).maybeSingle();
    if (error) throw error;
    return data;
  },
  async setWaterToday(userId, amount) {
    const { data, error } = await supabase.from('water_logs')
      .upsert({ user_id:userId, log_date: todayKey(), amount_ml: amount }, { onConflict:'user_id,log_date' })
      .select().single();
    if (error) throw error;
    return data;
  },
  async getAllUsersWithSubs() {
    const { data, error } = await supabase.from('profiles').select('*, subscriptions(*)').order('created_at', { ascending:false });
    if (error) throw error;
    return data;
  },
  async setSubscriptionStatus(userId, status, extendDays) {
    const expires = extendDays ? new Date(Date.now() + extendDays*86400000).toISOString() : undefined;
    const patch = { status, updated_at: new Date().toISOString() };
    if (expires) patch.expires_at = expires;
    const { data: existing } = await supabase.from('subscriptions').select('id').eq('user_id', userId).order('started_at',{ascending:false}).limit(1).maybeSingle();
    if (existing) {
      const { error } = await supabase.from('subscriptions').update(patch).eq('id', existing.id);
      if (error) throw error;
    } else {
      const { error } = await supabase.from('subscriptions').insert({ user_id:userId, status, expires_at:expires });
      if (error) throw error;
    }
  }
};

function isSubscriptionActive(sub) {
  if (!sub) return false;
  if (sub.status === 'canceled' || sub.status === 'expired') return false;
  if (!sub.expires_at) return sub.status === 'active';
  return new Date(sub.expires_at).getTime() > Date.now();
}

/* =========================================================================
   6) UI HELPERS
========================================================================= */
function ProgressRing({ value, max, size=132, stroke=12, color="#0E7C6B", track="#E4ECE9", label, sub }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(1, max ? value/max : 0));
  const offset = c * (1 - pct);
  return (
    <div className="relative" style={{ width:size, height:size }}>
      <svg width={size} height={size} style={{ transform:'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth={stroke} fill="none" />
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeLinecap="round" strokeDasharray={c}
          style={{ '--ring-final': offset, strokeDashoffset: c }} className="ring-anim" />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <div className="text-2xl font-extrabold text-ink">{label}</div>
        {sub && <div className="text-xs text-muted mt-0.5">{sub}</div>}
      </div>
    </div>
  );
}
function MacroBar({ name, value, goal, color }) {
  const pct = Math.max(0, Math.min(100, goal ? (value/goal)*100 : 0));
  return (
    <div className="bg-surface rounded-2xl p-3.5 shadow-card flex-1 min-w-0">
      <div className="flex items-center justify-between mb-2">
        <span className="text-xs font-semibold text-muted truncate">{name}</span>
        <span className="text-xs font-bold text-ink shrink-0">{Math.round(value)}/{Math.round(goal)}g</span>
      </div>
      <div className="h-2 rounded-full bg-line overflow-hidden">
        <div className="h-full rounded-full transition-all duration-700" style={{ width:`${pct}%`, background:color }} />
      </div>
    </div>
  );
}
function ConfidenceBadge({ value, t }) {
  const label = value >= 0.75 ? t.high : value >= 0.5 ? t.medium : t.low;
  const color = value >= 0.75 ? 'bg-primary-light text-primary-dark' : value >= 0.5 ? 'bg-carbs/15 text-amber-700' : 'bg-accent-light text-accent-dark';
  return <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full ${color}`}>{label}</span>;
}
function EmptyState({ icon, title, sub }) {
  return (
    <div className="flex flex-col items-center justify-center text-center py-10 px-6">
      <div className="text-5xl mb-3 float-icon">{icon}</div>
      <div className="font-bold text-ink mb-1">{title}</div>
      {sub && <div className="text-sm text-muted">{sub}</div>}
    </div>
  );
}
function FullLoading() {
  return (
    <div className="min-h-screen flex items-center justify-center">
      <div className="w-10 h-10 rounded-full border-4 border-primary-light border-t-primary spin-slow"></div>
    </div>
  );
}
function Header({ title, right }) {
  return (
    <div className="flex items-center justify-between px-5 pt-6 pb-2 safe-top">
      <h1 className="text-lg font-extrabold">{title}</h1>
      {right}
    </div>
  );
}
function Modal({ children, onClose }) {
  return (
    <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50 pop-in" onClick={onClose}>
      <div className="bg-surface rounded-t-3xl sm:rounded-3xl w-full sm:max-w-sm max-h-[85vh] overflow-y-auto p-5 pop-in" onClick={e=>e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
}

/* =========================================================================
   7) AUTH SCREEN
========================================================================= */
function AuthScreen({ t, onAuthed }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [info, setInfo] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setError(''); setInfo(''); setBusy(true);
    try {
      if (mode === 'login') {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        onAuthed(data.session);
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        if (data.session) onAuthed(data.session);
        else { setInfo(t.signupSuccess); setMode('login'); }
      }
    } catch (e) {
      setError(t.authError);
    } finally { setBusy(false); }
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 safe-top safe-bottom"
      style={{ background:'linear-gradient(180deg,#0E7C6B 0%,#0B5D50 100%)' }}>
      <div className="w-full max-w-sm bg-surface rounded-3xl shadow-pop p-6 fade-up">
        <div className="text-center mb-6">
          <div className="text-4xl mb-2">🍽️</div>
          <div className="font-extrabold text-lg">{t.appName}</div>
          <div className="text-xs text-muted mt-1">{t.tagline}</div>
        </div>
        <div className="flex bg-bg rounded-xl p-1 mb-5">
          <button onClick={()=>setMode('login')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${mode==='login'?'bg-primary text-white':'text-muted'}`}>{t.loginTitle}</button>
          <button onClick={()=>setMode('signup')} className={`flex-1 py-2 rounded-lg text-sm font-bold ${mode==='signup'?'bg-primary text-white':'text-muted'}`}>{t.signupTitle}</button>
        </div>
        <div className="flex flex-col gap-3">
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder={t.email}
            className="w-full border border-line rounded-xl px-4 py-3 outline-none focus:border-primary" />
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder={t.password}
            className="w-full border border-line rounded-xl px-4 py-3 outline-none focus:border-primary" />
          {error && <div className="text-xs font-semibold text-accent-dark">{error}</div>}
          {info && <div className="text-xs font-semibold text-primary-dark">{info}</div>}
          <button disabled={busy || !email || !password} onClick={submit}
            className="w-full bg-primary text-white font-bold py-3.5 rounded-xl disabled:opacity-40 active:scale-95 transition-transform">
            {busy ? '...' : (mode==='login' ? t.login : t.signup)}
          </button>
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   8) ONBOARDING
========================================================================= */
function Onboarding({ t, initial, onComplete }) {
  const [step, setStep] = useState(0);
  const [form, setForm] = useState(initial || { name:'', age:'', gender:'male', height:'', weight:'', activity:'moderate', goal:'maintain' });
  const set = (k,v) => setForm(f => ({...f,[k]:v}));
  const steps = ['basic','body','activity','goal'];
  const valid = () => {
    if (step===0) return form.name.trim().length>0 && Number(form.age)>0;
    if (step===1) return Number(form.height)>0 && Number(form.weight)>0;
    return true;
  };
  const finish = () => {
    const bmr = calcBMR({ gender:form.gender, weight:Number(form.weight), height:Number(form.height), age:Number(form.age) });
    const tdee = calcTDEE(bmr, form.activity);
    const goals = calcGoals({ tdee, goal:form.goal });
    onComplete({
      name: form.name, age: Number(form.age), gender: form.gender, height: Number(form.height), weight: Number(form.weight),
      activity: form.activity, goal: form.goal, bmr, tdee,
      goal_calories: goals.calories, goal_protein: goals.protein_g, goal_carbs: goals.carbs_g, goal_fat: goals.fat_g
    });
  };
  return (
    <div className="min-h-screen bg-bg safe-top safe-bottom px-5 py-6 flex flex-col">
      <div className="flex gap-1.5 mb-8">
        {steps.map((s,i)=>(<div key={s} className={`h-1.5 flex-1 rounded-full ${i<=step?'bg-primary':'bg-line'}`} />))}
      </div>
      <h2 className="text-xl font-extrabold mb-6">{t.onboardTitle}</h2>
      {step===0 && (
        <div className="flex flex-col gap-4 fade-up">
          <div><label className="text-sm font-semibold text-muted mb-1.5 block">{t.name}</label>
            <input value={form.name} onChange={e=>set('name',e.target.value)} className="w-full bg-surface border border-line rounded-xl px-4 py-3 outline-none focus:border-primary" /></div>
          <div><label className="text-sm font-semibold text-muted mb-1.5 block">{t.age}</label>
            <input type="number" value={form.age} onChange={e=>set('age',e.target.value)} className="w-full bg-surface border border-line rounded-xl px-4 py-3 outline-none focus:border-primary" /></div>
          <div><label className="text-sm font-semibold text-muted mb-1.5 block">{t.gender}</label>
            <div className="flex gap-3">
              {['male','female'].map(g=>(<button key={g} onClick={()=>set('gender',g)} className={`flex-1 py-3 rounded-xl font-semibold border ${form.gender===g?'bg-primary text-white border-primary':'bg-surface border-line text-muted'}`}>{t[g]}</button>))}
            </div></div>
        </div>
      )}
      {step===1 && (
        <div className="flex flex-col gap-4 fade-up">
          <div><label className="text-sm font-semibold text-muted mb-1.5 block">{t.height}</label>
            <input type="number" value={form.height} onChange={e=>set('height',e.target.value)} className="w-full bg-surface border border-line rounded-xl px-4 py-3 outline-none focus:border-primary" /></div>
          <div><label className="text-sm font-semibold text-muted mb-1.5 block">{t.weight}</label>
            <input type="number" value={form.weight} onChange={e=>set('weight',e.target.value)} className="w-full bg-surface border border-line rounded-xl px-4 py-3 outline-none focus:border-primary" /></div>
        </div>
      )}
      {step===2 && (
        <div className="flex flex-col gap-2.5 fade-up">
          {['sedentary','light','moderate','active','very_active'].map(a=>(
            <button key={a} onClick={()=>set('activity',a)} className={`text-start py-3.5 px-4 rounded-xl font-semibold border ${form.activity===a?'bg-primary text-white border-primary':'bg-surface border-line'}`}>{t[a]}</button>
          ))}
        </div>
      )}
      {step===3 && (
        <div className="flex flex-col gap-2.5 fade-up">
          {['lose','maintain','gain'].map(g=>(
            <button key={g} onClick={()=>set('goal',g)} className={`text-start py-3.5 px-4 rounded-xl font-semibold border ${form.goal===g?'bg-primary text-white border-primary':'bg-surface border-line'}`}>{t[g]}</button>
          ))}
        </div>
      )}
      <div className="mt-auto pt-8 flex gap-3">
        {step>0 && <button onClick={()=>setStep(s=>s-1)} className="flex-1 py-3.5 rounded-xl font-bold border border-line">{t.back}</button>}
        {step<3 ? (
          <button disabled={!valid()} onClick={()=>setStep(s=>s+1)} className="flex-1 py-3.5 rounded-xl font-bold bg-primary text-white disabled:opacity-40">{t.next}</button>
        ) : (
          <button onClick={finish} className="flex-1 py-3.5 rounded-xl font-bold bg-primary text-white">{t.finishOnboard}</button>
        )}
      </div>
    </div>
  );
}

function SubscriptionScreen({ t, sub, onLogout }) {
  const isTrial = sub && sub.status === 'trial' && isSubscriptionActive(sub);
  const daysLeft = sub?.expires_at ? Math.max(0, Math.ceil((new Date(sub.expires_at).getTime() - Date.now()) / 86400000)) : 0;
  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-8 text-center safe-top safe-bottom">
      <div className="text-6xl mb-5">{isTrial ? '⏳' : '🔒'}</div>
      <div className="font-extrabold text-xl mb-2">{isTrial ? t.subTrialTitle : t.subExpiredTitle}</div>
      {isTrial ? (
        <div className="text-3xl font-extrabold text-primary-dark mb-3">{daysLeft} {t.subDaysLeft}</div>
      ) : (
        <div className="text-sm text-muted mb-8">{t.subExpiredSub}</div>
      )}
      <div className="w-full max-w-xs flex flex-col gap-2.5 mt-4">
        <a href="https://wa.me/" target="_blank" className="w-full bg-primary text-white font-bold py-3.5 rounded-2xl">{t.contactUs}</a>
        <button onClick={onLogout} className="w-full text-muted font-semibold py-3">{t.logout}</button>
      </div>
    </div>
  );
}

========================================================================= */
function Dashboard({ t, lang, profile, meals, water, onScan, onOpenMeal, onAddWater }) {
  const goals = { calories:profile.goal_calories, protein_g:profile.goal_protein, carbs_g:profile.goal_carbs, fat_g:profile.goal_fat };
  const totals = meals.reduce((a,m)=>({
    calories:a.calories+m.total.calories, protein_g:a.protein_g+m.total.protein_g,
    carbs_g:a.carbs_g+m.total.carbs_g, fat_g:a.fat_g+m.total.fat_g
  }), {calories:0,protein_g:0,carbs_g:0,fat_g:0});
  const remaining = Math.max(0, goals.calories - totals.calories);
  const grouped = { breakfast:[], lunch:[], snack:[], dinner:[] };
  meals.forEach(m => grouped[m.slot||'snack'].push(m));

  return (
    <div className="pb-28">
      <div className="px-5 pt-6 safe-top flex items-center justify-between">
        <div>
          <div className="text-sm text-muted font-medium">{t.hello}</div>
          <div className="text-xl font-extrabold">{profile.name}</div>
        </div>
        <div className="w-11 h-11 rounded-full bg-primary-light flex items-center justify-center text-lg font-bold text-primary-dark">
          {profile.name?.[0]?.toUpperCase()||'F'}
        </div>
      </div>
      <div className="mx-5 mt-5 bg-surface rounded-3xl shadow-card p-5 flex items-center gap-5">
        <ProgressRing value={totals.calories} max={goals.calories} label={Math.round(totals.calories)} sub={t.kcal} color="#FF7A45" />
        <div className="flex-1">
          <div className="text-sm text-muted font-semibold mb-1">{t.todayCalories}</div>
          <div className="text-2xl font-extrabold text-ink mb-1">{Math.round(totals.calories)} <span className="text-sm text-muted font-medium">/ {goals.calories} {t.kcal}</span></div>
          <div className="text-xs font-semibold text-primary-dark bg-primary-light inline-block px-2.5 py-1 rounded-full">{t.remaining}: {remaining} {t.kcal}</div>
        </div>
      </div>
      <div className="flex gap-3 mx-5 mt-3">
        <MacroBar name={`🥩 ${t.protein}`} value={totals.protein_g} goal={goals.protein_g} color="#4C6EF5" />
        <MacroBar name={`🍚 ${t.carbs}`} value={totals.carbs_g} goal={goals.carbs_g} color="#F5B942" />
        <MacroBar name={`🥑 ${t.fat}`} value={totals.fat_g} goal={goals.fat_g} color="#B98CE0" />
      </div>
      <div className="mx-5 mt-5">
        <button onClick={onScan} className="w-full bg-accent text-white font-extrabold text-lg py-4 rounded-2xl shadow-pop active:scale-95 transition-transform pulse-glow">{t.scanMeal}</button>
      </div>
      <div className="mx-5 mt-6 bg-surface rounded-2xl shadow-card p-4 flex items-center justify-between">
        <div>
          <div className="text-sm font-bold">💧 {t.water}</div>
          <div className="text-xs text-muted mt-0.5">{(water/1000).toFixed(2)}L / 2.5L</div>
        </div>
        <div className="flex gap-2">
          <button onClick={()=>onAddWater(250)} className="text-xs font-bold bg-primary-light text-primary-dark px-3 py-2 rounded-xl active:scale-95">+250ml</button>
          <button onClick={()=>onAddWater(500)} className="text-xs font-bold bg-primary-light text-primary-dark px-3 py-2 rounded-xl active:scale-95">+500ml</button>
        </div>
      </div>
      <div className="mt-7 px-5">
        <h2 className="font-extrabold mb-3">{t.todayMeals}</h2>
        {meals.length===0 ? (
          <EmptyState icon="🍽️" title={t.noMeals} sub={t.noMealsSub} />
        ) : (
          <div className="flex flex-col gap-3">
            {['breakfast','lunch','snack','dinner'].filter(s=>grouped[s].length).map(slot=>(

                        <div className="font-bold text-sm truncate">{m.meal_name}</div>

function ProgressPage({ t, lang, meals, weightLog, onLogWeight }) {
  const chartRef = useRef(null); const chartInstance = useRef(null);
  const [newWeight, setNewWeight] = useState('');
  const last7 = useMemo(()=>{
    const days = [...Array(7)].map((_,i)=>{ const d = new Date(); d.setDate(d.getDate()-(6-i)); return todayKey(d); });
    return days.map(d=>{
      const dayMeals = meals.filter(m=>todayKey(new Date(m.time))===d);
      const cal = dayMeals.reduce((a,m)=>a+m.total.calories,0);
      const p = dayMeals.reduce((a,m)=>a+m.total.protein_g,0);
      return { d, cal, p };
    });
  }, [meals]);
  const avgCal = Math.round(last7.reduce((a,x)=>a+x.cal,0) / (last7.filter(x=>x.cal>0).length||1));
  const avgP = Math.round(last7.reduce((a,x)=>a+x.p,0) / (last7.filter(x=>x.p>0).length||1));
  useEffect(()=>{
    if (!chartRef.current || weightLog.length===0) return;
    if (chartInstance.current) chartInstance.current.destroy();
    chartInstance.current = new Chart(chartRef.current, {
      type:'line',
      data:{ labels: weightLog.map(w=>new Date(w.date).toLocaleDateString(lang==='ar'?'ar-EG':'en-US',{month:'short',day:'numeric'})),
        datasets:[{ data: weightLog.map(w=>w.weight), borderColor:'#0E7C6B', backgroundColor:'rgba(14,124,107,0.08)', tension:0.35, fill:true, pointBackgroundColor:'#0E7C6B', pointRadius:4 }] },
      options:{ plugins:{legend:{display:false}}, scales:{ y:{ grid:{color:'#E4ECE9'} }, x:{ grid:{display:false} } } }
    });
  }, [weightLog, lang]);
  return (
    <div className="min-h-screen bg-bg pb-28 safe-top">
      <Header title={t.progress} />
      <div className="px-5 mt-2 flex flex-col gap-4">
        <div className="grid grid-cols-2 gap-3">
          <div className="bg-surface rounded-2xl shadow-card p-4"><div className="text-xs font-semibold text-muted mb-1">{t.avgCalories}</div><div className="text-xl font-extrabold">{avgCal} <span className="text-xs font-medium text-muted">{t.kcal}</span></div></div>
          <div className="bg-surface rounded-2xl shadow-card p-4"><div className="text-xs font-semibold text-muted mb-1">{t.avgProtein}</div><div className="text-xl font-extrabold">{avgP}g</div></div>
        </div>
        <div className="bg-surface rounded-2xl shadow-card p-4">
          <div className="text-sm font-bold mb-3">{t.weightProgress}</div>
          {weightLog.length>0 ? <canvas ref={chartRef} height="160"></canvas> : <EmptyState icon="⚖️" title={t.logWeight} />}
          <div className="flex gap-2 mt-3">
            <input type="number" value={newWeight} onChange={e=>setNewWeight(e.target.value)} placeholder={t.weight} className="flex-1 border border-line rounded-xl px-3 py-2 text-sm outline-none focus:border-primary" />
            <button onClick={()=>{ if(newWeight){ onLogWeight(Number(newWeight)); setNewWeight(''); } }} className="bg-primary text-white font-bold px-4 rounded-xl text-sm">{t.save}</button>
          </div>
        </div>
        <div className="bg-surface rounded-2xl shadow-card p-4">
          <div className="text-sm font-bold mb-3">{lang==='ar'?'آخر 7 أيام':'Last 7 days'}</div>
          <div className="flex items-end justify-between gap-1.5 h-28">
            {last7.map((x,i)=>{
              const h = Math.min(100, (x.cal/2500)*100);
              return (<div key={i} className="flex-1 flex flex-col items-center justify-end h-full gap-1">
                <div className="w-full bg-primary/80 rounded-t-md transition-all duration-500" style={{ height:`${h}%`, minHeight: x.cal>0?'4px':'0' }}></div>
                <span className="text-[10px] text-muted">{new Date(x.d).toLocaleDateString(lang==='ar'?'ar-EG':'en-US',{weekday:'narrow'})}</span>
              </div>);
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

      <div className="px-5 mt-2 flex flex-col gap-4">
        <div className="bg-surface rounded-2xl shadow-card p-5 flex items-center gap-4">
          <div className="w-14 h-14 rounded-full bg-primary-light flex items-center justify-center text-xl font-bold text-primary-dark">{profile.name?.[0]?.toUpperCase()||'F'}</div>
          <div className="flex-1">
            <div className="font-extrabold">{profile.name}</div>
            <div className="text-xs text-muted">{profile.goal_calories} {t.kcal} · {t[profile.goal]}</div>
          </div>
          <button onClick={onEditProfile} className="text-xs font-bold text-primary">{t.edit}</button>
        </div>

        <div className="bg-surface rounded-2xl shadow-card p-4">
          <div className="text-sm font-bold mb-2">{lang==='ar'?'حالة الاشتراك':'Subscription'}</div>
          <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${isSubscriptionActive(sub)?'bg-primary-light text-primary-dark':'bg-accent-light text-accent-dark'}`}>
            {sub ? t['sub'+sub.status.charAt(0).toUpperCase()+sub.status.slice(1)] || sub.status : '—'}
          </span>
        </div>

        {isAdmin && (
          <button onClick={onOpenAdmin} className="bg-surface rounded-2xl shadow-card p-4 text-start font-bold text-sm flex items-center justify-between">
            {t.adminPanel} <span>›</span>
          </button>
        )}

        <div className="bg-surface rounded-2xl shadow-card p-4">
          <div className="text-sm font-bold mb-3">{t.settings}</div>
          <div className="flex items-center justify-between py-2">
            <span className="text-sm font-semibold">{t.language}</span>
            <div className="flex bg-bg rounded-xl p-1">
              <button onClick={()=>setLang('ar')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${lang==='ar'?'bg-primary text-white':'text-muted'}`}>عربي</button>
              <button onClick={()=>setLang('en')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${lang==='en'?'bg-primary text-white':'text-muted'}`}>English</button>
            </div>
          </div>
          <div className="flex items-center justify-between py-2 border-t border-line mt-1 pt-3">
            <span className="text-sm font-semibold">{t.demoMode}</span>
            <button onClick={()=>setDemoMode(!demoMode)} className={`w-12 h-7 rounded-full transition-colors ${demoMode?'bg-primary':'bg-line'} relative`}>
              <span className="absolute top-1 w-5 h-5 rounded-full bg-white transition-transform" style={{ [lang==='ar'?'right':'left']: demoMode ? '4px' : '26px' }}></span>
            </button>
          </div>
        </div>

        <div className="bg-surface rounded-2xl shadow-card p-4">
          <div className="text-sm font-bold mb-1.5">🔒 {t.privacy}</div>
          <div className="text-xs text-muted leading-relaxed">{t.privacyText}</div>
        </div>
        <div className="bg-surface rounded-2xl shadow-card p-4">
          <div className="text-sm font-bold mb-1.5">ℹ️ {t.about}</div>
          <div className="text-xs text-muted leading-relaxed">{t.disclaimer}</div>
        </div>
        <button onClick={onLogout} className="text-xs font-bold text-accent-dark py-3">{t.logout}</button>
      </div>
    </div>
  );
}
function BottomNav({ t, view, setView }) {
  const items = [
    { id:'dashboard', icon:'🏠', label:t.home },
    { id:'history', icon:'🗂️', label:t.history },
    { id:'scan', icon:'📸', label:t.scan, cta:true },
    { id:'progress', icon:'📈', label:t.progress },
    { id:'profile', icon:'👤', label:t.profile },
  ];
  return (
    <div className="fixed bottom-0 inset-x-0 bg-surface bn-shadow safe-bottom z-40">
      <div className="flex items-center justify-around px-2 py-2">
        {items.map(it => it.cta ? (
          <button key={it.id} onClick={()=>setView('scan')} className="-mt-7 w-16 h-16 rounded-full bg-accent text-white text-2xl flex items-center justify-center shadow-pop active:scale-90 transition-transform pulse-glow">{it.icon}</button>
        ) : (
          <button key={it.id} onClick={()=>setView(it.id)} className="flex flex-col items-center gap-0.5 px-3 py-1">
            <span className={`text-xl ${view===it.id?'':'opacity-50'}`}>{it.icon}</span>
            <span className={`text-[10px] font-bold ${view===it.id?'text-primary':'text-muted'}`}>{it.label}</span>
          </button>
        )}
      </div>
    </div>
  );
}

/* =========================================================================
   11) ROOT APP
========================================================================= */
function App() {
  const [lang, setLang] = useState('ar');
  const [demoMode, setDemoMode] = useState(true);
  const [session, setSession] = useState(undefined); // undefined = loading, null = logged out
  const [profile, setProfile] = useState(null);
  const [sub, setSub] = useState(null);
  const [meals, setMeals] = useState([]);
  const [weightLog, setWeightLog] = useState([]);
  const [water, setWater] = useState(0);
  const [view, setView] = useState('dashboard');
  const [flow, setFlow] = useState({});
  const [activeMeal, setActiveMeal] = useState(null);
  const [showAdmin, setShowAdmin] = useState(false);
  const [loadingData, setLoadingData] = useState(false);

  const t = STR[lang];
  useEffect(()=>{ document.documentElement.dir = lang==='ar'?'rtl':'ltr'; document.documentElement.lang = lang; }, [lang]);

  useEffect(()=>{
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabase.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  const loadAll = async (userId) => {
    setLoadingData(true);
    try {
      const [p, s, m, w, water] = await Promise.all([
        DB.getProfile(userId), DB.getSubscription(userId), DB.getMeals(userId), DB.getWeightLogs(userId), DB.getWaterToday(userId)
      ]);
      setProfile(p); setSub(s); setMeals(m); setWeightLog(w); setWater(water?.amount_ml || 0);
    } finally { setLoadingData(false); }
  };

  useEffect(()=>{
    if (session === undefined) return;
    if (session === null) { setProfile(null); setSub(null); setMeals([]); setWeightLog([]); setWater(0); return; }
    loadAll(session.user.id);
  }, [session]);

  const todayMeals = useMemo(()=> meals.filter(m => todayKey(new Date(m.time))===todayKey()), [meals]);
  const remaining = profile ? Math.max(0, profile.goal_calories - todayMeals.reduce((a,m)=>a+m.total.calories,0)) : 0;
  const remainingProtein = profile ? Math.max(0, profile.goal_protein - todayMeals.reduce((a,m)=>a+m.total.protein_g,0)) : 0;

  if (session === undefined || (session && loadingData && !profile)) return <FullLoading />;
  if (session === null) return <AuthScreen t={t} onAuthed={setSession} />;

  if (profile && !profile.name) {
    return <Onboarding t={t} onComplete={async (fields)=>{ const updated = await DB.upsertProfile(session.user.id, fields); setProfile(updated); }} />;
  }
  if (!profile) return <FullLoading />;

  const isAdmin = profile.role === 'admin';
  if (!isAdmin && !isSubscriptionActive(sub)) {
    return <SubscriptionScreen t={t} sub={sub} onLogout={()=>supabase.auth.signOut()} />;
  }

  const handleImageReady = async (file) => {
    const dataUrl = await compressImage(file);
    setFlow({ image: dataUrl }); setView('preview');
  };
  const handleAnalyze = async () => {
    setView('analyzing');
    try {
      const result = await AIProvider.analyzeFoodImage(flow.image, { demoMode });
      setFlow(f => ({ ...f, result })); setView('results');
    } catch (e) { setView('error'); }
  };
  const handleSaveMeal = async (slot) => {
    const saved = await DB.addMeal(session.user.id, { ...flow.result, slot, image:flow.image });
    setMeals(m => [...m, { id:saved.id, meal_name:saved.meal_name, slot:saved.slot, items:saved.items, total:saved.total, image:saved.image_url, uncertainty_notes:saved.uncertainty_notes, time:new Date(saved.logged_at).getTime() }]);
    setFlow({}); setView('dashboard');
  };
  const deleteMeal = async (id) => { await DB.deleteMeal(id); setMeals(m => m.filter(x=>x.id!==id)); };
  const addWater = async (ml) => { const amount = water + ml; setWater(amount); await DB.setWaterToday(session.user.id, amount); };
  const logWeight = async (w) => { const saved = await DB.addWeightLog(session.user.id, w); setWeightLog(wl => [...wl, { id:saved.id, weight:saved.weight, date:new Date(saved.logged_at).getTime() }]); };

  return (
    <div className="min-h-screen bg-bg">
      {view==='dashboard' && (
        <React.Fragment>
          <Dashboard t={t} lang={lang} profile={profile} meals={todayMeals} water={water}
            onScan={()=>setView('scan')} onOpenMeal={setActiveMeal} onAddWater={addWater} />
          <SmartSuggestion t={t} remaining={remaining} remainingProtein={Math.round(remainingProtein)} />
        </React.Fragment>
      )}
      {view==='history' && <HistoryPage t={t} lang={lang} meals={meals} onOpen={setActiveMeal} />}
      {view==='progress' && <ProgressPage t={t} lang={lang} meals={meals} weightLog={weightLog} onLogWeight={logWeight} />}
      {view==='profile' && (
        <ProfilePage t={t} lang={lang} setLang={setLang} profile={profile} sub={sub} isAdmin={isAdmin} demoMode={demoMode} setDemoMode={setDemoMode}
          onEditProfile={()=>setProfile({...profile, name:''})}
          onLogout={()=>supabase.auth.signOut()}
          onOpenAdmin={()=>setShowAdmin(true)} />
      )}
      {view==='scan' && <ScanPage t={t} onImageReady={handleImageReady} onCancel={()=>setView('dashboard')} />}
      {view==='preview' && <PreviewPage t={t} image={flow.image} onAnalyze={handleAnalyze} onBack={()=>setView('scan')} />}
      {view==='analyzing' && <AnalyzingPage t={t} />}
      {view==='error' && <ErrorPage t={t} onRetry={handleAnalyze} onPickAnother={()=>setView('scan')} onManual={()=>{
        setFlow(f=>({...f, result:{ meal_name: lang==='ar'?'وجبة يدوية':'Manual meal', items:[], total:{calories:0,protein_g:0,carbs_g:0,fat_g:0}, uncertainty_notes:[] }}));
        setView('results');
      }} />}
      {view==='results' && flow.result && (
        <ResultsPage t={t} lang={lang} image={flow.image} result={flow.result}
          setResult={(fn)=>setFlow(f=>({...f, result: typeof fn==='function' ? fn(f.result) : fn }))}
          onSave={handleSaveMeal} onBack={()=>setView('dashboard')} />
      )}
      {['dashboard','history','progress','profile'].includes(view) && <BottomNav t={t} view={view} setView={setView} />}
      {activeMeal && <MealDetailModal t={t} lang={lang} meal={activeMeal} onClose={()=>setActiveMeal(null)} onDelete={deleteMeal} />}
      {showAdmin && <AdminPanel t={t} lang={lang} onClose={()=>setShowAdmin(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
